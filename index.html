<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoGoBag Roadmap</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            text-align: center;
        }

        #gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 320px;
        }

        #gate input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            outline: none;
        }

        #gate input[type="password"]:focus {
            border-color: #0071e3;
        }

        #gate button,
        #logout {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            background: #0071e3;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
        }

        #gate button:hover,
        #logout:hover {
            background: #005bb8;
        }

        #error {
            color: #d70015;
            font-size: 0.9rem;
            min-height: 1.2rem;
            text-align: center;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-width: 220px;
        }

        ul li a {
            display: block;
            padding: 0.75rem 1.5rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            color: #0071e3;
            text-align: center;
            transition: background 0.15s, box-shadow 0.15s;
            cursor: pointer;
        }

        ul li a:hover {
            background: #0071e3;
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        #logout {
            width: auto;
            margin-top: 2rem;
            background: transparent;
            color: #6e6e73;
            border: 1px solid #d2d2d7;
        }

        #logout:hover {
            background: #e8e8ed;
            color: #1d1d1f;
        }

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            overflow: auto;
            z-index: 10;
        }

        #viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #viewerClose {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 11;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            background: #1d1d1f;
            color: #fff;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>GoGoBag Roadmap</h1>

    <form id="gate">
        <input type="password" id="password" placeholder="Пароль" autocomplete="current-password" required />
        <button type="submit">Увійти</button>
        <div id="error"></div>
    </form>

    <ul id="list" class="hidden"></ul>
    <button id="logout" class="hidden" type="button">Вийти</button>

    <div id="viewer">
        <button id="viewerClose">Закрити ✕</button>
        <iframe id="viewerFrame"></iframe>
    </div>

    <script>
        const SESSION_KEY = 'gogobag_pwd';
        const PBKDF2_ITERATIONS = 100000;

        const gateForm = document.getElementById('gate');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('error');
        const listEl = document.getElementById('list');
        const logoutBtn = document.getElementById('logout');
        const viewerEl = document.getElementById('viewer');
        const viewerFrame = document.getElementById('viewerFrame');
        const viewerClose = document.getElementById('viewerClose');

        function base64ToBytes(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        async function deriveKey(password, saltB64) {
            const salt = base64ToBytes(saltB64);
            const baseKey = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decryptPayload(password, payload) {
            const key = await deriveKey(password, payload.salt);
            const iv = base64ToBytes(payload.iv);
            const data = base64ToBytes(payload.data);
            const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
            return new TextDecoder().decode(plainBuf);
        }

        async function fetchAndDecrypt(password, url) {
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error(`Fetch failed: ${url}`);
            const payload = await res.json();
            return decryptPayload(password, payload);
        }

        function renderList(manifest) {
            listEl.innerHTML = '';
            for (const entry of manifest) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = entry.label;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    openEntry(entry);
                });
                li.appendChild(a);
                listEl.appendChild(li);
            }
        }

        async function openEntry(entry) {
            const password = sessionStorage.getItem(SESSION_KEY);
            try {
                const html = await fetchAndDecrypt(password, entry.file);
                viewerFrame.srcdoc = html;
                viewerEl.style.display = 'block';
            } catch (err) {
                alert('Не вдалося розшифрувати сторінку. Спробуйте увійти знову.');
                logout();
            }
        }

        function showApp() {
            gateForm.classList.add('hidden');
            listEl.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
        }

        function showGate() {
            gateForm.classList.remove('hidden');
            listEl.classList.add('hidden');
            logoutBtn.classList.add('hidden');
            passwordInput.value = '';
        }

        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            showGate();
        }

        async function tryLogin(password) {
            errorEl.textContent = '';
            try {
                const manifestJson = await fetchAndDecrypt(password, 'manifest.enc');
                const manifest = JSON.parse(manifestJson);
                sessionStorage.setItem(SESSION_KEY, password);
                renderList(manifest);
                showApp();
            } catch (err) {
                errorEl.textContent = 'Невірний пароль';
            }
        }

        gateForm.addEventListener('submit', (e) => {
            e.preventDefault();
            tryLogin(passwordInput.value);
        });

        logoutBtn.addEventListener('click', logout);

        viewerClose.addEventListener('click', () => {
            viewerEl.style.display = 'none';
            viewerFrame.srcdoc = '';
        });

        // Auto-login if a password is already stored for this tab session.
        const storedPassword = sessionStorage.getItem(SESSION_KEY);
        if (storedPassword) {
            tryLogin(storedPassword);
        }
    </script>
</body>

</html>
